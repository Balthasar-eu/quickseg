[package]
name = "quickseg"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.0"

[dev-dependencies]
criterion = "0.7"
tempfile = "3"
rand = "0.9"
rand_distr = "0.5"

[[bench]]
name = "quickseg_runtime"
harness = false

[[bin]]
name = "quickseg"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
strip = true
