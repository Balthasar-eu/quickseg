[package]
name = "quickseg"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
clap = { version = "4.5.1", features = ["derive"] }
flate2 = "1.0"

[build-dependencies]
cc = "1.0"

[[bin]]
name = "quickseg"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
strip = true

[build]
rustflags = ["-C", "target-cpu=native"]
